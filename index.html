<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soundcheck Lab · Live Sound 練耳</title><link rel="stylesheet" href="style.css"><body><header><div><small>LIVE SOUND • EAR TRAINING</small><h1>Soundcheck Lab <span>練耳室</span></h1></div><button id="stop" class="danger">■ STOP 停聲</button></header><main><p class="safety">🎧 請先將耳機／喇叭實體音量調低。模擬 feedback 並非真實回授；唔好用嚟 ring out 現場系統。耳仔攰就停低休息。</p><section class="toolbar"><label>模式<select id="mode"><option value="learn">Learn 學習</option><option value="practice" selected>Practice 練習</option><option value="challenge">Challenge 挑戰</option></select></label><label>時長<select id="duration"><option value="5">5 分鐘</option><option value="10">10 分鐘</option></select></label><label>安全音量 <input id="volume" type="range" min="0" max="0.22" step="0.005" value="0.07"></label><button id="session">開始新 session</button><strong id="clock">05:00</strong></section><nav id="modules"></nav><section class="source"><h3>聲音素材 · 全部本機處理</h3><div class="row"><label>來源<select id="source"><option value="pink">Pink noise 粉紅噪音</option><option value="vocal">合成 Vocal-ish</option><option value="drums">合成 Drum-ish</option><option value="file" disabled>自己嘅音檔</option></select></label><label class="upload">載入音檔<input type="file" id="file" accept="audio/*"></label><label>Loop 起點 (s)<input id="loopStart" type="number" min="0" step="0.1" value="0"></label><label>Loop 終點 (s)<input id="loopEnd" type="number" min="0.1" step="0.1" value="4"></label></div><p id="fileInfo">無需上載或登入。Frequency ID 使用 sine；Vocal 模組預設合成人聲。</p></section><section id="exercise"></section><section><h2>進度 Progress</h2><div id="progress" class="stats"></div><p id="weak"></p><button id="reset">清除本機進度</button></section><footer>離線靜態 v1 · 無 tracking · 唔係聽力測試或現場安全認證。瀏覽器音量／limiter 唔能夠保證實體聲壓安全。</footer><p id="status" role="status" aria-live="polite">準備好。按播放先會啟動音訊。</p></main><script src="app.js"></script></body></html>
